# nice!nano v2 - Split Central für GMMK Pro BT-Bridge

# Split: nice!nano ist der Central (BLE-Host)
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Wired Split via UART (P0.06=TX, P0.08=RX am nice!nano) – ZMK nativ
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_ZMK_SPLIT_WIRED=y
CONFIG_ZMK_SPLIT_WIRED_UART_MODE_INTERRUPT=y

# BLE zum Host (PC / Mac / Handy)
CONFIG_ZMK_BLE=y
CONFIG_BT_DEVICE_NAME="GMMK Pro"

# USB HID als Fallback (kabelgebunden über nice!nano USB-C)
CONFIG_ZMK_USB=y

# Bluetooth-Profile (5 Geräte speicherbar)
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# Stromsparen
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
